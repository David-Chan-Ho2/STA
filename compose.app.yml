services:
  server:
    build:
      context: ./server
    container_name: server
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mosquitto:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    networks:
      - app-network

  dashboard:
    build:
      context: ./dashboard
    container_name: dashboard
    restart: always 
    working_dir: /app
    command: npm run dev
    depends_on:
      - server
    ports:
      - "3000:3000"
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
      - dashboard_next_cache:/app/.next
    environment:
    - WATCHPACK_POLLING=true
    - CHOKIDAR_USEPOLLING=true
    - NEXT_TELEMETRY_DISABLED=1
    networks:
      - app-network

volumes:
  dashboard_node_modules:
  dashboard_next_cache:

networks:
  app-network:
    name: shared-app-network
    driver: bridge
